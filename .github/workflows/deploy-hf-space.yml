name: Deploy staging backend
# phase2 smoke trigger: align the final admin-course release without a runtime change
on:
  push:
    branches:
      - main
      - "codex/release-*"
      - "codex/phase-8-beta-release"
    paths:
      - .github/workflows/deploy-hf-space.yml
      - backend/.dockerignore
      - backend/Dockerfile
      - backend/alembic.ini
      - backend/poetry.lock
      - backend/pyproject.toml
      - backend/app/**
      - backend/alembic/**
      - backend/data/**
      - backend/scripts/**
      - backend/static/**
      - backend/*.py
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git commit SHA whose backend tree should be deployed
        required: true
        type: string
      release_ref:
        description: Release branch containing the immutable SHA
        required: true
        type: string

concurrency:
  group: deploy-hf-staging
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

# Phase 2's exact-SHA smoke reads the Vercel deployment status target URL;
# keeping this deploy workflow in the release path list ensures any promotion
# contract/concurrency/metadata/group/path change is redeployed to the same immutable backend SHA.

jobs:
  deploy:
    name: Hugging Face Space
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_OIDC_RESOURCE: spaces/MoAmin9/chinverse-api
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
      STAGING_BASE_URL: https://moamin9-chinverse-api.hf.space
    steps:
      - name: Validate release SHA
        shell: bash
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi

      - name: Checkout immutable release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify checked-out release
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          case "$RELEASE_REF" in
            main|codex/release-*|codex/phase-8-beta-release) ;;
            *)
              echo "Unsupported release ref: ${RELEASE_REF}" >&2
              exit 1
              ;;
          esac
          git fetch --no-tags origin "$RELEASE_REF"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/$RELEASE_REF"

      - name: Require successful quality gates for this exact release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality-gates.yml/runs?event=push&head_sha=${RELEASE_SHA}&per_page=20"
          for attempt in $(seq 1 80); do
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")"
            conclusion="$(jq -r '[.workflow_runs[] | select(.head_sha == env.RELEASE_SHA)] | sort_by(.created_at) | last | if . == null then "missing" elif .status != "completed" then .status else .conclusion end' <<<"$payload")"
            case "$conclusion" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale)
                echo "Quality gates for ${RELEASE_SHA} concluded ${conclusion}" >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for successful quality gates for ${RELEASE_SHA}" >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Export immutable backend tree
        shell: bash
        run: |
          export_dir="${RUNNER_TEMP}/chinverse-backend-release"
          mkdir -p "$export_dir"
          git archive "${RELEASE_SHA}:backend" | tar -x -C "$export_dir"
          printf '%s\n' "$RELEASE_SHA" > "$export_dir/RELEASE_SHA"

      - name: Install Hugging Face CLI
        run: python -m pip install --disable-pip-version-check "huggingface_hub==1.27.0"

      - name: Mirror backend to staging Space
        shell: bash
        run: >-
          hf upload MoAmin9/chinverse-api
          "${RUNNER_TEMP}/chinverse-backend-release" .
          --repo-type=space
          --delete="*"
          --commit-message="Deploy Chinverse backend from ${RELEASE_SHA}"

      - name: Verify deployed release and readiness
        shell: bash
        run: |
          for attempt in $(seq 1 80); do
            payload="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "${STAGING_BASE_URL}/health" || true)"
            deployed_sha="$(jq -r '.release // "missing"' <<<"$payload" 2>/dev/null || echo missing)"
            if [[ "$deployed_sha" == "$RELEASE_SHA" ]] && jq -e \
              '.status == "ok" and .deployment_tier == "staging" and .indexable == false' \
              <<<"$payload" >/dev/null; then
              ready_payload="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "${STAGING_BASE_URL}/health/ready" || true)"
              if jq -e '.status == "ok" and .checks.database_target == "ok" and .checks.database == "ok" and .checks.storage == "ok"' <<<"$ready_payload" >/dev/null; then
                exit 0
              fi
              echo "Release ${RELEASE_SHA} is live but database target/storage readiness is not healthy yet (attempt ${attempt}/80)"
            else
              echo "Waiting for ${RELEASE_SHA}; staging currently reports ${deployed_sha} (attempt ${attempt}/80)"
            fi
            sleep 15
          done
          echo "Staging did not report immutable release ${RELEASE_SHA} with healthy database/storage readiness before timeout" >&2
          exit 1
