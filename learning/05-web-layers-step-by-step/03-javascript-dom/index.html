<!doctype html>
<html lang="fa" dir="rtl">
  <head>

    <title>کتابخانهٔ کوچک ما</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>

      <p id="selection-summary" role="status">هنوز کتابی انتخاب نکرده‌ای</p>
    </main>
    <script type="module" src="/src/main.js"></script>
