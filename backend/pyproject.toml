[project]
name = "chinverse-backend"
version = "0.1.0"
description = "Backend for ChinVerse"
authors = [
    { name = "Admin", email = "admin@chinverse.com" },
]
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
fastapi = "^0.139.2"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic-settings = "^2.1.0"
email-validator = "^2.1.0"
bcrypt = "4.0.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pyjwt = "^2.13.0"
python-multipart = "^0.0.32"
pillow = "^12.3.0"
pillow-heif = "^1.5.0"
boto3 = "^1.43.58"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1"
pytest = ">=8,<10"
pytest-asyncio = ">=0.24,<2"
pytest-cov = ">=6,<8"
ruff = ">=0.12,<1"
pip-audit = "2.10.1"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires the isolated PostgreSQL test database",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"app/schemas/__init__.py" = ["F401"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
